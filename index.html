<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disc Golf Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>Disc Golf Calc</h2>
    </div>

    <div class="config-controls" style="margin-bottom: 10px;">
        <select id="savedCourseSelect" style="width: 100%; padding: 10px 8px; font-family: monospace; border: 2px solid var(--text-main); border-radius: 2px; background: var(--card-bg);">
            <option value="" disabled selected>Select Saved Course...</option>
            <option value="custom">Custom / New Course</option>
        </select>
    </div>
    
    <div class="config-controls">
        <button type="button" id="toggleParBtn">Edit Pars</button>
        <input type="number" id="holeNum" inputmode="numeric" placeholder="Holes" min="1" max="21">
        <input type="number" id="par" inputmode="numeric" placeholder="Default Par" min="1" max="5">
    </div>

    <p id="holes"></p>

    <h3 id="totalScore">Total Score: 0</h3>
    <input type="text" id="name" placeholder="Course Name">
    <div id="saveCourseCheckboxContainer" style="margin-bottom: 12px; font-family: monospace; font-size: 0.85rem; display: none;">
        <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="saveCourseLayoutCheck"> Save this course layout for future rounds
        </label>
    </div>

    <div class="action-buttons-row">
        <button type="button" id="saveRoundBtn" class="goodBtn">Save Round</button>
        <a href="scores">
            <button type="button" id="viewScores" class="goodBtn">View Scores</button>
        </a>
        <a href="bag">
            <button type="button" id="viewBag" class="goodBtn" style="background-color: var(--bunker-sand); color: var(--golf-green-dark);">Disc Bag</button>
        </a>
        <a href="throw">
            <button type="button" id="viewThrow" class="goodBtn" style="background-color: var(--fairway-accent); color: white;">GPS Throw</button>
        </a>
    </div>

    <script src="app.js"></script>
</body>
</html>
