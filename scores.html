<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Round History - Disc Golf Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h2>Round History</h2>
    </div>

    <!-- Navigation back to calculator -->
    <div style="margin-bottom: 16px;">
        <a href="index" style="text-decoration: none; font-family: monospace; font-weight: bold; color: var(--golf-green);">← Back to Calculator</a>
    </div>

    <!-- Container where saved rounds will appear -->
    <div id="historyList"></div>

    <!-- Clear History Button -->
    <div style="margin-top: 30px;">
        <button type="button" id="clearHistoryBtn" style="background-color: #a94442; color: white; border: 2px solid var(--golf-green-dark); padding: 12px; border-radius: 4px; font-weight: 700; cursor: pointer; width: 100%; font-family: monospace;">Clear History</button>
    </div>

    <script src="scores.js"></script>
</body>
</html>
